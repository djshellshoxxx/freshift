name: Browser smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - name: Browser-only local and HTTP search
        run: |
          python3 -m http.server 9157 --bind 127.0.0.1 >/tmp/freshsift-http.log 2>&1 &
          node qa/browser-e2e.cjs
