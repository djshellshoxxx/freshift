name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test -race ./... -count=1 -timeout=90s
      - name: UI contract and syntax checks (Node)
        run: |
          node --check web/app.js
          node --check web/browser-engine.js
          node --check extension/content-script.js
          node --check extension/background.js
          node qa/ui-contract.test.cjs
          node qa/pages-parity.test.cjs
          node qa/browser-engine.test.cjs
          node qa/extension-contract.test.cjs
          node qa/browser-bridge.test.cjs
          node qa/pages-workflow.test.cjs
      - name: End-to-end local HTTP API smoke tests
        run: |
          go build -o /tmp/freshsift-ci .
          python3 qa/api-smoke.py /tmp/freshsift-ci
      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags='-s -w' -o /tmp/FreshSift-windows-amd64.exe .
