name: Build and publish Windows release
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify before release
        run: |
          go vet ./...
          go test -race ./... -count=1 -timeout=90s
          node --check web/app.js
          node qa/ui-contract.test.cjs
          node qa/pages-parity.test.cjs
          node qa/release-workflow.test.cjs
          go build -o /tmp/freshsift-release-smoke .
          python3 qa/api-smoke.py /tmp/freshsift-release-smoke
      - name: Cross-compile Windows x64 executable
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/FreshSift-windows-amd64.exe .
          (cd dist && sha256sum FreshSift-windows-amd64.exe > SHA256SUMS.txt)
      - name: Publish release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FreshSift ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true
          files: |
            dist/FreshSift-windows-amd64.exe
            dist/SHA256SUMS.txt
      - name: Publish v0.4.0 Windows DNS/PTR prerelease on first main push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 release already exists; preserve its immutable tag and binaries"
          else
            gh release create v0.4.0 dist/FreshSift-windows-amd64.exe dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "FreshSift v0.4.0" --notes "DNS record search and DNS-only mode; optional subdomain guessing and CT; forward-confirmed page and subdomain PTR lookups with independent crawl depth; CSV/JSON DNS and PTR inventories; Go and GitHub Pages parity." --prerelease
          fi
      - name: Upload workflow artifact for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FreshSift-windows-amd64
          path: dist/
