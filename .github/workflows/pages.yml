# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# GITHUB_TOKEN can deploy an existing Pages site, but cannot create it.
name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'qa/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check dashboard and Pages asset parity
        run: |
          node --check docs/app.js
          node --check docs/browser-engine.js
          node --check docs/starter-lists.js
          node qa/starter-lists.test.cjs
          node --check docs/dns-intel.js
          node --check extension/background.js
          node qa/ui-contract.test.cjs
          node qa/pages-parity.test.cjs
          node qa/browser-engine.test.cjs
          node qa/perpetual-browser.test.cjs
          node qa/dns-intel.test.cjs
          node qa/dns-intel-flow.test.cjs
          node qa/extension-contract.test.cjs
          node qa/browser-bridge.test.cjs
          node qa/pages-workflow.test.cjs
          test -s docs/dns-intel.js
          test -s docs/index.html
          test -f docs/.nojekyll
          test -s docs/style.css
          test -s docs/favicon.svg
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
