name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: 'pages'
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Run static-site tests
        run: |
          node --check docs/app.js
          node --check docs/browser-engine.js
          node --check extension/background.js
          node qa/ui-contract.test.cjs
          node qa/pages-parity.test.cjs
          node qa/browser-engine.test.cjs
          node qa/extension-contract.test.cjs
          node qa/browser-bridge.test.cjs
          test -f docs/index.html
          test -f docs/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
