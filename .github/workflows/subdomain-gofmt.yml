name: Temporary subdomain Go formatting
on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/freshsift/subdomains.go'
      - 'internal/freshsift/subdomains_test.go'
      - 'internal/freshsift/types.go'
      - 'internal/freshsift/engine.go'
      - 'main.go'
      - '.github/workflows/subdomain-gofmt.yml'
permissions:
  contents: write
jobs:
  gofmt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format changed Go sources
        run: |
          gofmt -w internal/freshsift/subdomains.go internal/freshsift/subdomains_test.go internal/freshsift/types.go internal/freshsift/engine.go main.go
          if git diff --quiet; then
            echo "Formatting already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/freshsift/subdomains.go internal/freshsift/subdomains_test.go internal/freshsift/types.go internal/freshsift/engine.go main.go
          git commit -m "style: gofmt subdomain enumeration"
          git push origin HEAD:${{ github.head_ref }}
